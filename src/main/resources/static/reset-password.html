<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>设置新密码 · Sports Training Assistant</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f4f6fa; font-family: Arial, "Microsoft YaHei", sans-serif; color: #1c2b3b; }
        main { width: min(100%, 440px); background: white; padding: 32px; border: 1px solid #e2e8f0; border-radius: 16px; }
        h1 { font-size: 24px; margin-top: 0; }
        label { display: block; font-weight: 600; margin: 18px 0 6px; }
        input { display: block; width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; font: inherit; }
        button { width: 100%; border: 0; background: #2563eb; color: white; border-radius: 8px; padding: 12px; margin-top: 20px; font: inherit; cursor: pointer; }
        button:disabled { opacity: .55; cursor: not-allowed; }
        a { color: #2563eb; }
        .message { min-height: 20px; margin-top: 16px; line-height: 1.6; }
        .error { color: #b42318; }
    </style>
</head>
<body>
<main>
    <h1>设置新密码</h1>
    <p>重置链接有效期为 20 分钟，并且只能使用一次。</p>
    <form id="resetForm">
        <label for="password">新密码（8–72 个字符）</label>
        <input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        <label for="confirm">再次输入新密码</label>
        <input id="confirm" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        <button id="submitButton" type="submit" disabled>正在读取安全信息...</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <p><a href="/login.html">返回登录</a></p>
</main>
<script>
    // The token is in the URL fragment. Remove it immediately from the visible address.
    const rawToken = new URLSearchParams(location.hash.slice(1)).get("token");
    history.replaceState(null, "", "/reset-password.html");

    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    let csrf = null;

    function show(text, error = false) {
        message.textContent = text;
        message.classList.toggle("error", error);
    }

    if (!rawToken || !/^[A-Za-z0-9_-]{43}$/.test(rawToken)) {
        show("重置链接无效。请重新申请邮件。", true);
        button.textContent = "无法重置";
    } else {
        fetch("/api/auth/csrf", {credentials: "same-origin"})
            .then(response => {
                if (!response.ok) throw new Error("无法获取安全令牌");
                return response.json();
            })
            .then(data => {
                csrf = data;
                button.disabled = false;
                button.textContent = "确认修改密码";
            })
            .catch(error => show(error.message, true));
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;
        if (password !== confirm) {
            show("两次输入的密码不一致。", true);
            return;
        }

        button.disabled = true;
        show("");
        try {
            const response = await fetch("/api/auth/password-reset/confirm", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    [csrf.headerName]: csrf.token
                },
                body: JSON.stringify({token: rawToken, newPassword: password})
            });
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error || "链接失效或密码不符合要求");
            }
            form.hidden = true;
            show("密码修改成功！现在可以使用新密码登录。");
        } catch (error) {
            show(error.message, true);
            button.disabled = false;
        }
    });
</script>
</body>
</html>
