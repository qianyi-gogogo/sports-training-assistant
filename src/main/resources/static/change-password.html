<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 · Sports Training Assistant</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f4f6fa; color: #1c2b3b; font-family: Arial, "Microsoft YaHei", sans-serif; }
        .card { width: min(100%, 460px); padding: 32px; background: white; border: 1px solid #e2e8f0; border-radius: 16px; }
        h1 { font-size: 24px; margin-top: 0; }
        p { line-height: 1.6; color: #64748b; }
        label { display: block; margin: 17px 0 7px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
        button { width: 100%; padding: 12px; background: #2563eb; border: 0; color: white; border-radius: 8px; font: inherit; margin-top: 22px; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        a { color: #2563eb; text-decoration: none; }
        .error { color: #b42318; }
        .message { min-height: 22px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>修改登录密码</h1>
        <p>需要先输入当前密码。修改成功后，当前会话将退出。</p>
        <form id="passwordForm">
            <label for="currentPassword">当前密码</label>
            <input id="currentPassword" type="password" autocomplete="current-password" required>
            <label for="newPassword">新密码</label>
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
            <label for="confirmPassword">确认新密码</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" required>
            <p id="message" class="message error" role="alert"></p>
            <button id="saveButton" type="submit">确认修改密码</button>
        </form>
        <p><a href="/">返回 Dashboard</a></p>
    </main>
    <script>
        const form = document.getElementById("passwordForm");
        const message = document.getElementById("message");
        const button = document.getElementById("saveButton");

        form.addEventListener("submit", async event => {
            event.preventDefault();
            if (!form.reportValidity()) return;

            const newPassword = document.getElementById("newPassword").value;
            if (newPassword !== document.getElementById("confirmPassword").value) {
                message.textContent = "两次输入的新密码不一致。";
                return;
            }

            button.disabled = true;
            message.textContent = "";
            try {
                const csrfResponse = await fetch("/api/auth/csrf", { credentials: "same-origin" });
                if (!csrfResponse.ok) throw new Error("无法获取安全令牌，请重新登录");
                const csrf = await csrfResponse.json();

                const response = await fetch("/api/auth/change-password", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        [csrf.headerName]: csrf.token
                    },
                    body: JSON.stringify({
                        currentPassword: document.getElementById("currentPassword").value,
                        newPassword: newPassword
                    })
                });

                if (response.redirected && new URL(response.url).pathname === "/login.html") {
                    location.assign("/login.html");
                    return;
                }
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.error || "修改失败（HTTP " + response.status + "）");
                }
                location.assign("/login.html?passwordChanged=1");
            } catch (error) {
                message.textContent = error.message;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
