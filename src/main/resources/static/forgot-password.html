<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>找回密码 · Sports Training Assistant</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f4f6fa; font-family: Arial, "Microsoft YaHei", sans-serif; color: #1c2b3b; }
        main { width: min(100%, 440px); background: white; padding: 32px; border: 1px solid #e2e8f0; border-radius: 16px; }
        h1 { font-size: 24px; margin: 0 0 12px; }
        p { line-height: 1.6; }
        label { display: block; font-weight: 600; margin: 18px 0 6px; }
        input { display: block; width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; font: inherit; }
        button { width: 100%; border: 0; background: #2563eb; color: white; border-radius: 8px; padding: 12px; margin-top: 20px; font: inherit; cursor: pointer; }
        button:disabled { opacity: .55; cursor: not-allowed; }
        a { color: #2563eb; }
        .message { min-height: 20px; margin-top: 16px; }
        .error { color: #b42318; }
    </style>
</head>
<body>
<main>
    <h1>找回密码</h1>
    <p>输入注册邮箱。若该邮箱对应一个账户，我们会发送有效期为 20 分钟的重置链接。</p>
    <form id="requestForm">
        <label for="email">注册邮箱</label>
        <input id="email" type="email" autocomplete="email" maxlength="254" required>
        <button id="submitButton" type="submit" disabled>正在读取安全信息...</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <p><a href="/login.html">返回登录页面</a></p>
</main>
<script>
    const form = document.getElementById("requestForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    let csrf = null;

    fetch("/api/auth/csrf", {credentials: "same-origin"})
        .then(response => {
            if (!response.ok) throw new Error("无法获取安全令牌");
            return response.json();
        })
        .then(data => {
            csrf = data;
            button.disabled = false;
            button.textContent = "发送重置链接";
        })
        .catch(error => {
            message.textContent = error.message;
            message.classList.add("error");
        });

    form.addEventListener("submit", async event => {
        event.preventDefault();
        button.disabled = true;
        message.textContent = "";
        message.classList.remove("error");
        try {
            const response = await fetch("/api/auth/password-reset/request", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    [csrf.headerName]: csrf.token
                },
                body: JSON.stringify({email: document.getElementById("email").value.trim()})
            });
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error || "发送失败，请稍后重试");
            }
            message.textContent = "如果该邮箱已经注册，我们会发送重置邮件。请检查收件箱和垃圾邮件。";
            form.reset();
        } catch (error) {
            message.textContent = error.message;
            message.classList.add("error");
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
