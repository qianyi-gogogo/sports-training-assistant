<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 · Sports Training Assistant</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f4f6fa; color: #1c2b3b; font-family: Arial, "Microsoft YaHei", sans-serif; }
        .card { max-width: 460px; padding: 32px; border: 1px solid #e2e8f0; border-radius: 16px; background: white; }
        h1 { font-size: 24px; margin: 0 0 15px; }
        p { line-height: 1.7; }
        .notice { padding: 16px; border-radius: 10px; background: #f5f7fb; }
        a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <main class="card">
        <h1>找回密码</h1>
        <p class="notice">邮箱重置密码功能尚未开放。目前还没有配置邮件发送服务和一次性重置链接，因此此页面不会发送邮件，也不能直接修改密码。</p>
        <p>如果你仍然记得旧密码，请登录后使用“修改密码”。忘记旧密码的测试账户需要由项目管理员安全地协助重置。</p>
        <p><a href="/login.html">返回登录页面</a></p>
    </main>

</html>
