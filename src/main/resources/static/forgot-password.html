<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>找回密码 · Sports Training Assistant</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f4f6fa; font-family: Arial, "Microsoft YaHei", sans-serif; color: #1c2b3b; }
        main { width: min(100%, 460px); background: white; padding: 32px; border: 1px solid #e2e8f0; border-radius: 16px; }
        h1 { font-size: 24px; margin: 0 0 12px; }
        p { line-height: 1.6; }
        label { display: block; font-weight: 600; margin: 18px 0 6px; }
        input { display: block; width: 100%; min-width: 0; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; font: inherit; }
        small { display: block; margin-top: 7px; color: #64748b; line-height: 1.6; }
        button { border: 0; background: #2563eb; color: white; border-radius: 8px; padding: 12px; font: inherit; cursor: pointer; }
        button:disabled { opacity: .55; cursor: not-allowed; }
        #submitButton { width: 100%; margin-top: 22px; }
        #sendButton { flex: 0 0 auto; }
        .code-row { display: flex; gap: 8px; align-items: stretch; }
        a { color: #2563eb; }
        .message { min-height: 20px; margin: 12px 0 0; }
        .error { color: #b42318; }
        .success { color: #166534; }
    </style>
</head>
<body>
<main>
    <h1>找回密码</h1>
    <p>通过已验证的注册邮箱接收验证码，在本页面设置新密码。</p>
    <form id="resetForm">
        <label for="email">注册邮箱</label>
        <input id="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="code">邮箱验证码</label>
        <div class="code-row">
            <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="6位数字">
            <button id="sendButton" type="button" disabled>发送验证码</button>
        </div>
        <small>验证码最长有效期10分钟。60秒后可再次申请；每小时最多发送5次、累计允许5次错误验证。</small>
        <p id="sendMessage" class="message" role="status" aria-live="polite"></p>
        <label for="password">新密码</label>
        <input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        <small>8–72个字符，最多72个UTF-8字节。</small>
        <label for="confirm">确认新密码</label>
        <input id="confirm" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        <button id="submitButton" type="submit" disabled>重置密码</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>
    <p><a href="/login.html">返回登录页面</a></p>
</main>
<script>
    const form = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const codeInput = document.getElementById("code");
    const sendButton = document.getElementById("sendButton");
    const submitButton = document.getElementById("submitButton");
    const sendMessage = document.getElementById("sendMessage");
    const message = document.getElementById("message");
    let csrf = null;
    let busy = false;
    let cooldownUntil = 0;
    let timer = null;

    function show(element, text, type = "") {
        element.textContent = text;
        element.className = "message" + (type ? " " + type : "");
    }

    function updateButtons() {
        const remaining = Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000));
        sendButton.disabled = !csrf || busy || remaining > 0;
        sendButton.textContent = remaining > 0 ? `${remaining}秒后重发` : "发送验证码";
        submitButton.disabled = !csrf || busy;
    }

    function startCooldown() {
        cooldownUntil = Date.now() + 60_000;
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
            updateButtons();
            if (Date.now() >= cooldownUntil) {
                clearInterval(timer);
                timer = null;
            }
        }, 250);
        updateButtons();
    }

    async function post(path, body) {
        const response = await fetch(path, {
            method: "POST", credentials: "same-origin", cache: "no-store",
            headers: { "Content-Type": "application/json", [csrf.headerName]: csrf.token },
            body: JSON.stringify(body)
        });
        if (!response.ok) {
            if (response.status === 403 || response.status === 401) {
                throw new Error("安全会话已过期，请刷新页面后重试。");
            }
            const data = await response.json().catch(() => ({}));
            throw new Error(data.error || "操作失败，请稍后重试。");
        }
    }

    emailInput.addEventListener("input", () => {
        codeInput.value = "";
        show(sendMessage, "");
        show(message, "");
    });

    sendButton.addEventListener("click", async () => {
        if (!csrf || busy || Date.now() < cooldownUntil) return;
        if (!emailInput.reportValidity()) return;
        const requestedEmail = emailInput.value.trim();
        busy = true;
        emailInput.readOnly = true;
        updateButtons();
        show(sendMessage, "");
        try {
            await post("/api/auth/password-reset/request", { email: requestedEmail });
            show(sendMessage, "如果该邮箱已注册、完成验证且符合发送限制，我们会发送验证码。请检查收件箱和垃圾邮件。", "success");
            codeInput.value = "";
            startCooldown();
            codeInput.focus();
        } catch (error) {
            show(sendMessage, error.message, "error");
        } finally {
            emailInput.readOnly = false;
            busy = false;
            updateButtons();
        }
    });

    form.addEventListener("submit", async event => {
        event.preventDefault();
        if (!csrf || busy || !form.reportValidity()) return;
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;
        if (password !== confirm) {
            show(message, "两次输入的密码不一致。", "error");
            return;
        }
        if (new TextEncoder().encode(password).length > 72 || !password.trim()) {
            show(message, "密码不能为空白，且最多72个UTF-8字节。", "error");
            return;
        }
        busy = true;
        emailInput.readOnly = true;
        updateButtons();
        show(message, "");
        try {
            await post("/api/auth/password-reset/confirm", {
                email: emailInput.value.trim(), code: codeInput.value, newPassword: password
            });
            form.reset();
            location.replace("/login.html?passwordChanged=1");
        } catch (error) {
            show(message, error.message, "error");
            emailInput.readOnly = false;
            busy = false;
            updateButtons();
        }
    });

    fetch("/api/auth/csrf", {credentials: "same-origin", cache: "no-store"})
        .then(response => {
            if (!response.ok) throw new Error("无法获取安全令牌。");
            return response.json();
        })
        .then(data => {
            if (!data.headerName || !data.token) throw new Error("安全令牌无效。");
            csrf = data;
            updateButtons();
        })
        .catch(error => show(message, error.message + " 请刷新页面。", "error"));
</script>
</body>
</html>
