<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · Sports Training Assistant</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fa; color: #1c2b3b; font-family: Arial, "Microsoft YaHei", sans-serif; padding: 20px; }
        .card { width: min(100%, 440px); padding: 32px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; }
        h1 { font-size: 24px; margin: 0 0 8px; }
        p { line-height: 1.55; }
        .muted { color: #64748b; }
        label { display: block; font-weight: 600; margin: 20px 0 7px; }
        input { display: block; width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; padding: 12px; }
        button { margin-top: 24px; padding: 12px; width: 100%; background: #2563eb; color: white; border: none; border-radius: 8px; font: inherit; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        .links { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; margin-top: 22px; }
        a { color: #2563eb; text-decoration: none; }
        .message { min-height: 20px; margin-top: 16px; color: #166534; }
        .error { color: #b42318; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Sports Training Assistant</h1>
        <p class="muted">登录你的训练账户</p>
        <form method="post" action="/login" id="loginForm">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <input type="hidden" name="_csrf" id="csrfToken">
            <p id="message" class="message" role="status"></p>
            <button type="submit" id="loginButton" disabled>加载登录安全信息...</button>
        </form>
        <div class="links">
            <a href="/register.html">创建新账户</a>
            <a href="/forgot-password.html">忘记密码？</a>
        </div>
    </main>
    <script>
        const params = new URLSearchParams(location.search);
        const message = document.getElementById("message");
        if (params.has("error")) {
            message.textContent = "用户名或密码错误，或者邮箱尚未完成验证。";
            message.classList.add("error");
        } else if (params.has("verified")) {
            message.textContent = "邮箱验证成功，请登录。";
        } else if (params.has("registered")) {
            message.textContent = "注册成功，请登录。";
        } else if (params.has("passwordChanged")) {
            message.textContent = "密码已修改，请使用新密码重新登录。";
        } else if (params.has("logout")) {
            message.textContent = "已退出登录。";
        }
        fetch("/api/auth/csrf", { credentials: "same-origin" })
            .then(async response => {
                if (!response.ok) throw new Error("无法取得安全令牌");
                const data = await response.json();
                if (!data.token) throw new Error("安全令牌为空");
                document.getElementById("csrfToken").value = data.token;
                const button = document.getElementById("loginButton");
                button.textContent = "登录";
                button.disabled = false;
            })
            .catch(error => {
                message.textContent = "页面初始化失败：" + error.message + "，请刷新重试。";
                message.classList.add("error");
            });
    </script>
</body>
</html>
